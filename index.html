<!DOCTYPE html>
<html>
<head>
  <title>मेरी पहली वेबसाइट</title>
  <style>
    body { font-family: Arial; text-align: center; margin-top: 50px; }
    .refer-box { border: 1px solid #aaa; padding: 20px; width: 300px; margin: auto; }
  </style>
</head>
<body>
  <h1>स्वागत है मेरी वेबसाइट पर!</h1>
  <div class="refer-box">
    <h2>Refer & Earn</h2>
    <p>अपने दोस्तों को invite करें और इनाम पाएं!</p>
    <form>
      <input type="text" placeholder="आपका नाम"><br><br>
      <input type="email" placeholder="Email"><br><br>
      <input type="text" placeholder="Friend's Email"><br><br>
      <button type="submit">Submit</button>
    </form>
  </div>
</body>
</html>
